name: E2E

# Sprint 13 / F13-A-6 + Sprint 14 / F14-A —
# Firebase emulator suite + local Next.js dev server 위에서 Playwright e2e.
#
# 정책:
#  - draft PR 제외
#  - chromium-desktop + chromium-mobile 만 실행 (CI 기본). webkit 은 nightly cron 별도
#  - emulator 모드는 OAuth 우회 + 운영 데이터 격리

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    # Sprint 19 F19-B — docs/markdown 전용 변경은 E2E skip (CI 비용 절감).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'README*'
      - 'LICENSE'
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  push:
    branches: [staging, main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'README*'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      base_url:
        description: '대상 URL (default: localhost + emulator)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  playwright:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Sprint 15 F15-D — webkit-mobile (iPhone 14) project 추가.
        # webkit 의 Firebase RTDB long-polling 호환은 emulator 9000 직접 연결로 검증.
        project: [chromium-desktop, chromium-mobile, webkit-mobile]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Java (Firebase emulator runtime)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (${{ matrix.project }})
        # Sprint 15 F15-D — project 별 분기 (chromium / webkit)
        run: |
          if [ "${{ matrix.project }}" = "webkit-mobile" ]; then
            pnpm playwright install --with-deps webkit
          else
            pnpm playwright install --with-deps chromium
          fi

      - name: Cache firebase-tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase
          key: firebase-tools-${{ runner.os }}

      - name: Install firebase-tools
        run: npm install -g firebase-tools@13

      - name: Disable Emulator UI in CI (Sprint 17 / F17-C)
        # CI runner 가 port 4400 (Emulator UI) 바인딩 실패 시 emulator 전체가
        # shutdown 됨. firebase.json 의 ui.enabled 를 false 로 동적 갱신.
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('firebase.json','utf-8'));c.emulators.ui.enabled=false;fs.writeFileSync('firebase.json',JSON.stringify(c,null,2));"
          cat firebase.json

      - name: Start Firebase emulator suite (background)
        run: |
          firebase emulators:start \
            --only auth,firestore,storage,database \
            --project demo-kkaebizigi-test \
            > .emulator.log 2>&1 &
          echo "emulator pid: $!"

      - name: Wait for emulator ports
        run: |
          npx wait-on \
            tcp:127.0.0.1:9099 \
            tcp:127.0.0.1:8080 \
            tcp:127.0.0.1:9199 \
            tcp:127.0.0.1:9000 \
            --timeout 120000

      - name: Run Playwright (${{ matrix.project }}) with emulator
        env:
          # Sprint 28 F28-B — emulator env 정합.
          # 이전엔 NEXT_PUBLIC_FIREBASE_* 안 주입 → emulator 분기에서 일부 코드
          # (RTDB realtime-db.ts) 가 fallback URL 생성 → 'https://undefined-default-rtdb...'
          # 잘못된 URL → 70회 RTDB 에러 + cascade. 추가로 NEXT_PUBLIC_E2E_MODE +
          # NEXT_PUBLIC_FIREBASE_USE_EMULATOR 가 webServer 미전파되는 케이스도
          # 대비해 emulator env 명시.
          NEXT_PUBLIC_FIREBASE_USE_EMULATOR: 'true'
          FIREBASE_USE_EMULATOR: 'true'
          NEXT_PUBLIC_E2E_MODE: 'true'
          E2E_USE_EMULATOR: 'true'
          E2E_BASE_URL: 'http://localhost:3000'
          NEXT_PUBLIC_FIREBASE_API_KEY: 'demo-api-key'
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'demo-kkaebizigi-test.firebaseapp.com'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'demo-kkaebizigi-test'
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: 'demo-kkaebizigi-test.appspot.com'
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: 'http://localhost:9000?ns=demo-kkaebizigi-test'
          AUTH_SECRET: 'e2e-test-secret-do-not-use-in-production'
          NEXTAUTH_SECRET: 'e2e-test-secret-do-not-use-in-production'
          CI: 'true'
        run: pnpm playwright test --project=${{ matrix.project }}

      - name: Show emulator log on failure
        if: failure()
        run: tail -100 .emulator.log || true

      - name: Upload Playwright report
        if: always()
        id: upload-report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: e2e/playwright-report
          retention-days: 14

      - name: Upload test-results (failure traces + screenshots)
        if: failure()
        id: upload-traces
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: e2e/test-results
          retention-days: 14

      # Sprint 15 F15-J — fail 시 PR comment 에 trace + 첫 screenshot 인라인
      - name: Parse Playwright results.json (failure summary)
        if: failure()
        id: parse-results
        run: |
          set -e
          RESULTS="e2e/playwright-report/results.json"
          if [ ! -f "$RESULTS" ]; then
            echo "summary=Results JSON not found." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PASSED=$(jq '[.suites[]?.specs[]?.tests[]? | select(.status=="passed")] | length' "$RESULTS")
          FAILED=$(jq '[.suites[]?.specs[]?.tests[]? | select(.status=="failed")] | length' "$RESULTS")
          FLAKY=$(jq '[.suites[]?.specs[]?.tests[]? | select(.status=="flaky")] | length' "$RESULTS")
          {
            echo "summary<<EOF"
            echo "Passed: ${PASSED}  Failed: ${FAILED}  Flaky: ${FLAKY}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # 첫 fail spec 이름 5개
          jq -r '[.suites[]?.specs[]?.tests[]? | select(.status=="failed") | .title][:5][]' "$RESULTS" > /tmp/failed-specs.txt || true

      - name: Comment summary on PR (success)
        if: success() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: e2e-${{ matrix.project }}
          message: |
            ### Playwright E2E — `${{ matrix.project }}` ✓

            **Mode**: Firebase emulator + localhost dev
            **Status**: success
            **Artifact**: `playwright-report-${{ matrix.project }}` (HTML report)

      - name: Comment summary on PR (failure)
        if: failure() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: e2e-${{ matrix.project }}
          message: |
            ### Playwright E2E — `${{ matrix.project }}` ✗

            **Mode**: Firebase emulator + localhost dev
            **Status**: ${{ job.status }}
            **Summary**: ${{ steps.parse-results.outputs.summary }}

            **Artifacts**:
            - HTML report: download `playwright-report-${{ matrix.project }}` from "Details" above
            - Traces + screenshots: download `playwright-test-results-${{ matrix.project }}`

            **Reproduce locally**:
            ```bash
            ./scripts/test-e2e.sh --use-emulator -- --project=${{ matrix.project }}
            npx playwright show-trace e2e/test-results/.../trace.zip
            ```

            **Emulator log tail (last 100 lines)**: see "Show emulator log on failure" step
