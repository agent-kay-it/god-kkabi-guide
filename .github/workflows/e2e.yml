name: E2E

# Sprint 13 / F13-A-6 + Sprint 14 / F14-A —
# Firebase emulator suite + local Next.js dev server 위에서 Playwright e2e.
#
# 정책:
#  - draft PR 제외
#  - chromium-desktop + chromium-mobile 만 실행 (CI 기본). webkit 은 nightly cron 별도
#  - emulator 모드는 OAuth 우회 + 운영 데이터 격리

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      base_url:
        description: '대상 URL (default: localhost + emulator)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  playwright:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-mobile]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Java (Firebase emulator runtime)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm playwright install --with-deps chromium

      - name: Cache firebase-tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase
          key: firebase-tools-${{ runner.os }}

      - name: Install firebase-tools
        run: npm install -g firebase-tools@13

      - name: Start Firebase emulator suite (background)
        run: |
          firebase emulators:start \
            --only auth,firestore,storage,database \
            --project demo-kkaebizigi-test \
            > .emulator.log 2>&1 &
          echo "emulator pid: $!"

      - name: Wait for emulator ports
        run: |
          npx wait-on \
            tcp:127.0.0.1:9099 \
            tcp:127.0.0.1:8080 \
            tcp:127.0.0.1:9199 \
            tcp:127.0.0.1:9000 \
            --timeout 120000

      - name: Run Playwright (${{ matrix.project }}) with emulator
        env:
          NEXT_PUBLIC_FIREBASE_USE_EMULATOR: 'true'
          FIREBASE_USE_EMULATOR: 'true'
          NEXT_PUBLIC_E2E_MODE: 'true'
          E2E_USE_EMULATOR: 'true'
          E2E_BASE_URL: 'http://localhost:3000'
          CI: 'true'
        run: pnpm playwright test --project=${{ matrix.project }}

      - name: Show emulator log on failure
        if: failure()
        run: tail -100 .emulator.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: e2e/playwright-report
          retention-days: 14

      - name: Upload test-results (failure traces + screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: e2e/test-results
          retention-days: 14

      - name: Comment summary on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: e2e-${{ matrix.project }}
          message: |
            ### Playwright E2E — `${{ matrix.project }}`
            Mode: Firebase emulator + localhost dev (Sprint 14 F14-A)
            Result: ${{ job.status }}
            Artifacts: `playwright-report-${{ matrix.project }}` (HTML), `playwright-test-results-${{ matrix.project }}` (traces on failure)
