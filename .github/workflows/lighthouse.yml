name: Lighthouse CI

# Sprint 12 / F12-E-1 + Sprint 15 / F15-H — Vercel preview deploy 후 자동
# Lighthouse 측정 + budget 검증 + lighthouserc.json assert preset.
# 결과를 GitHub PR comment 로 게시 + temporary-public-storage 업로드.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      url:
        description: '측정 URL (default: 자동 감지된 Vercel preview)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Vercel preview
        id: vercel
        if: github.event_name == 'pull_request'
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
          check_interval: 15

      - name: Resolve target URL
        id: url
        run: |
          if [ -n "${{ github.event.inputs.url }}" ]; then
            echo "target=${{ github.event.inputs.url }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ steps.vercel.outputs.url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Lighthouse (with lighthouserc.json + budget)
        # Sprint 15 F15-H — configPath 로 lighthouserc.json 의 assert preset 활용.
        # budget 은 resource size, lighthouserc 는 score / web vitals.
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.url.outputs.target }}
            ${{ steps.url.outputs.target }}/post
            ${{ steps.url.outputs.target }}/chat
            ${{ steps.url.outputs.target }}/me
            ${{ steps.url.outputs.target }}/search
          configPath: ./lighthouserc.json
          budgetPath: ./.lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3

      - name: Comment results on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lighthouse-ci
          message: |
            ### Lighthouse CI

            **Target**: ${{ steps.url.outputs.target }}
            **URLs**: `/`, `/post`, `/chat`, `/me`, `/search` (5 pages × 3 runs)

            **Assert preset** (lighthouserc.json):
            - Performance: warn ≥80
            - Accessibility: **error ≥90**
            - Best Practices: warn ≥90
            - SEO: warn ≥90
            - LCP < 4s, FCP < 2s, CLS < 0.1, TBT < 300ms

            **Budget** (.lighthouse-budget.json):
            - Script ≤400KB, Image ≤1500KB, Stylesheet ≤80KB, Font ≤200KB
            - Third-party ≤25 requests

            Detailed report: temporary-public-storage URL in artifacts
