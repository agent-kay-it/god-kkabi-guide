name: Visual Baseline Update

# Sprint 16 / F16-E — 의도된 UI 변경 시 visual baseline 자동 rebaseline + PR 생성.
# Sprint 17 / F17-E — workflow registration refresh (GitHub side cache 갱신).
#
# Trigger: workflow_dispatch (수동 실행)
# - reason: rebaseline 이유 (PR description 에 포함)
# - project: chromium-desktop / chromium-mobile / webkit-mobile / all

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Rebaseline 이유 (예: "Hero CTA 색상 변경 (Sprint 16 F16-X)")'
        required: true
        type: string
      project:
        description: '대상 project'
        required: true
        default: 'all'
        type: choice
        options:
          - chromium-desktop
          - chromium-mobile
          - webkit-mobile
          - all

permissions:
  contents: write
  pull-requests: write

jobs:
  rebaseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Java (Firebase emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: |
          if [ "${{ inputs.project }}" = "all" ]; then
            pnpm playwright install --with-deps chromium webkit
          elif [ "${{ inputs.project }}" = "webkit-mobile" ]; then
            pnpm playwright install --with-deps webkit
          else
            pnpm playwright install --with-deps chromium
          fi

      - name: Install firebase-tools
        run: npm install -g firebase-tools@13

      - name: Disable Emulator UI in CI (Sprint 17 / F17-C)
        # CI runner port 4400 (Emulator UI) 바인딩 실패 회피
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('firebase.json','utf-8'));c.emulators.ui.enabled=false;fs.writeFileSync('firebase.json',JSON.stringify(c,null,2));"

      - name: Start Firebase emulator
        run: |
          firebase emulators:start \
            --only auth,firestore,storage,database \
            --project demo-kkaebizigi-test \
            > .emulator.log 2>&1 &
          npx wait-on \
            tcp:127.0.0.1:9099 tcp:127.0.0.1:8080 \
            tcp:127.0.0.1:9199 tcp:127.0.0.1:9000 \
            --timeout 120000

      - name: Update visual baselines
        env:
          NEXT_PUBLIC_FIREBASE_USE_EMULATOR: 'true'
          FIREBASE_USE_EMULATOR: 'true'
          NEXT_PUBLIC_E2E_MODE: 'true'
          E2E_USE_EMULATOR: 'true'
          E2E_BASE_URL: 'http://localhost:3000'
          CI: 'true'
        run: |
          if [ "${{ inputs.project }}" = "all" ]; then
            pnpm playwright test e2e/tests/visual --update-snapshots
          else
            pnpm playwright test e2e/tests/visual --project=${{ inputs.project }} --update-snapshots
          fi

      - name: Create rebaseline PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH="chore/visual-rebaseline-$(date +%s)"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          if git diff --quiet e2e/visual/snapshots/; then
            echo "No snapshot changes — skipping PR"
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add e2e/visual/snapshots/
          git commit -m "chore(visual): rebaseline — ${{ inputs.reason }}

Project: ${{ inputs.project }}
Triggered by: @${{ github.actor }}

🤖 Generated by visual-baseline workflow"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "chore(visual): rebaseline — ${{ inputs.reason }}" \
            --body "## Visual Rebaseline

**Reason**: ${{ inputs.reason }}
**Project**: ${{ inputs.project }}
**Triggered by**: @${{ github.actor }}

## Review checklist
- [ ] Diff 의 시각 변경이 의도된 UI 변경과 일치
- [ ] 의도되지 않은 페이지의 변경 없음
- [ ] Hero / CTA 등 핵심 UI 의 정렬 유지

🤖 Generated by visual-baseline workflow" \
            --base staging
