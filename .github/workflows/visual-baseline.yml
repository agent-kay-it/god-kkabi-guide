name: Visual Baseline Update

# Sprint 16 / F16-E — 의도된 UI 변경 시 visual baseline 자동 rebaseline + PR 생성.
# Sprint 17 / F17-E — workflow registration refresh (GitHub side cache 갱신).
#
# Trigger: workflow_dispatch (수동 실행)
# - reason: rebaseline 이유 (PR description 에 포함)
# - project: chromium-desktop / chromium-mobile / webkit-mobile / all

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Rebaseline 이유 (예: "Hero CTA 색상 변경 (Sprint 16 F16-X)")'
        required: true
        type: string
      project:
        description: '대상 project'
        required: true
        default: 'all'
        type: choice
        options:
          - chromium-desktop
          - chromium-mobile
          - webkit-mobile
          - all
  # Sprint 19 / F19-D — PR 에 [visual-baseline] 라벨 포함 시 자동 capture.
  # workflow_dispatch 는 default branch (main) 에만 등록되므로, staging
  # workflow 의 변경을 검증하기 위해 pull_request label 트리거 추가.
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  rebaseline:
    # workflow_dispatch 면 항상 실행, pull_request 면 visual-baseline 라벨일 때만.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'visual-baseline')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Java (Firebase emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Resolve target project
        id: target
        # Sprint 19 F19-D — PR label 트리거 시 inputs.project 미정의. 기본값 'all'.
        run: |
          P="${{ inputs.project }}"
          if [ -z "$P" ]; then P="all"; fi
          echo "project=$P" >> "$GITHUB_OUTPUT"

      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.target.outputs.project }}" = "all" ]; then
            pnpm playwright install --with-deps chromium webkit
          elif [ "${{ steps.target.outputs.project }}" = "webkit-mobile" ]; then
            pnpm playwright install --with-deps webkit
          else
            pnpm playwright install --with-deps chromium
          fi

      - name: Install firebase-tools
        run: npm install -g firebase-tools@13

      - name: Disable Emulator UI in CI (Sprint 17 / F17-C)
        # CI runner port 4400 (Emulator UI) 바인딩 실패 회피
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('firebase.json','utf-8'));c.emulators.ui.enabled=false;fs.writeFileSync('firebase.json',JSON.stringify(c,null,2));"

      - name: Start Firebase emulator
        run: |
          firebase emulators:start \
            --only auth,firestore,storage,database \
            --project demo-kkaebizigi-test \
            > .emulator.log 2>&1 &
          npx wait-on \
            tcp:127.0.0.1:9099 tcp:127.0.0.1:8080 \
            tcp:127.0.0.1:9199 tcp:127.0.0.1:9000 \
            --timeout 120000

      - name: Update visual baselines
        env:
          NEXT_PUBLIC_FIREBASE_USE_EMULATOR: 'true'
          FIREBASE_USE_EMULATOR: 'true'
          NEXT_PUBLIC_E2E_MODE: 'true'
          E2E_USE_EMULATOR: 'true'
          E2E_BASE_URL: 'http://localhost:3000'
          CI: 'true'
        run: |
          if [ "${{ steps.target.outputs.project }}" = "all" ]; then
            pnpm playwright test e2e/tests/visual --update-snapshots
          else
            pnpm playwright test e2e/tests/visual --project=${{ steps.target.outputs.project }} --update-snapshots
          fi

      - name: Resolve commit metadata
        id: meta
        # Sprint 19 F19-D — PR label 트리거 시 inputs.reason 미정의.
        run: |
          REASON="${{ inputs.reason }}"
          if [ -z "$REASON" ]; then
            REASON="Auto baseline capture (PR label trigger)"
          fi
          # newline 안전 처리: HEREDOC 으로 GITHUB_OUTPUT 에 작성
          {
            echo "reason<<EOF"
            echo "$REASON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create rebaseline PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ steps.meta.outputs.reason }}
          PROJECT: ${{ steps.target.outputs.project }}
        run: |
          set -e
          BRANCH="chore/visual-rebaseline-$(date +%s)"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          if git diff --quiet e2e/visual/snapshots/; then
            echo "No snapshot changes — skipping PR"
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add e2e/visual/snapshots/
          ACTOR_TAG="@${{ github.actor }}"
          COMMIT_MSG=$(printf 'chore(visual): rebaseline — %s\n\nProject: %s\nTriggered by: %s\n\n🤖 Generated by visual-baseline workflow' "$REASON" "$PROJECT" "$ACTOR_TAG")
          git commit -m "$COMMIT_MSG"
          git push -u origin "$BRANCH"
          PR_BODY=$(printf '## Visual Rebaseline\n\n**Reason**: %s\n**Project**: %s\n**Triggered by**: %s\n\n## Review checklist\n- [ ] Diff 의 시각 변경이 의도된 UI 변경과 일치\n- [ ] 의도되지 않은 페이지의 변경 없음\n- [ ] Hero / CTA 등 핵심 UI 의 정렬 유지\n\n🤖 Generated by visual-baseline workflow' "$REASON" "$PROJECT" "$ACTOR_TAG")
          gh pr create --title "chore(visual): rebaseline — $REASON" --body "$PR_BODY" --base staging
