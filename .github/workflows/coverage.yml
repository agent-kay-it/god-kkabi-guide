name: Coverage

# Sprint 15 / F15-E — lib/ + hooks/ + components/ unit test coverage 측정.
# Vitest + @vitest/coverage-v8 (v8 provider).
#
# 정책:
#  - PR 마다 측정 + baseline 비교
#  - threshold (Sprint 15 baseline): lines 10% / branches 40% / functions 50%
#  - artifact 로 HTML report 업로드 (review 가능)
#  - LCOV 출력 (Codecov / Coveralls 통합 향후 가능)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [staging, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run coverage
        run: pnpm test:coverage

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14

      - name: Comment coverage summary
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          message: |
            ### Vitest Coverage

            Artifact: `coverage-html` (download from "Details" above)
            Threshold: lines 10% / branches 40% / functions 50% (Sprint 15 baseline)
            Sprint 16 target: lines 50% / branches 50% / functions 70%
